name: AudioGateway CI

on:
  push:
    branches: [ main, master, 'feat/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: Test & Build (-race)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify Go Module dependencies
        run: go mod verify

      - name: Run Hermetic Unit & Integration Tests (-race)
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./tests/...

      - name: Build AudioGateway Server Binary
        run: CGO_ENABLED=0 go build -v -o bin/audio-gateway ./cmd/server
